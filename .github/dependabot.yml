version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      open-pull-requests-limit: 5
      ignore:
          # the native API library is pinned on purpose: lib/bridge.js uses its internal message table
          - dependency-name: '@2colors/esphome-native-api'
      groups:
          dev-dependencies:
              dependency-type: development
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
