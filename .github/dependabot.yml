version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: cron
          cronjob: '23 3 9 * *' # once a month, on the 9th
          timezone: Europe/Amsterdam
      # only versions that have been public for a week: less exposure to a compromised release
      cooldown:
          default-days: 7
      open-pull-requests-limit: 15
      ignore:
          # the native API library is pinned on purpose: lib/bridge.js uses its internal message table
          - dependency-name: '@2colors/esphome-native-api'
          # @types/node follows the lowest supported Node.js version (engines), not the newest
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
      groups:
          dev-dependencies:
              dependency-type: development
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: cron
          cronjob: '41 3 9 * *'
          timezone: Europe/Amsterdam
